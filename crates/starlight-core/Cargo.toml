[package]
name = "starlight-core"
version = "0.1.0"
edition = "2021"
description = "Núcleo de traducción bidireccional Java ↔ Bedrock para Minecraft"
license = "MIT"
repository = "https://github.com/TU_ORGANIZACION/starlight-core"

[dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"
rand = "0.8"

[[bench]]
name = "translation_bench"
harness = false

[features]
default = []
full = ["ffi"]
ffi = []
