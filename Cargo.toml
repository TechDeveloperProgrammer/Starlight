[workspace]
resolver = "2"

members = [
    "crates/starlight-core",
    "crates/starlight-ffi",
    "crates/starlight-protocol-common",
    "crates/starlight-java-model",
    "crates/starlight-bedrock-model",
    "crates/starlight-translate",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/TU_ORGANIZACION/starlight-core"
authors = ["Starlight Core Team"]

[workspace.dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
criterion = "0.5"
proptest = "1.4"
rand = "0.8"
